name: Main branch

on:
    workflow_dispatch:
    push:
        branches:
            - main
    merge_group:

permissions:
    id-token: write
    contents: read

env:
    TZ: ${{ vars.TZ }}
    FORCE_COLOR: 1

jobs:
    validate:
        name: Validate
        uses: ./.github/workflows/validate.yml
        secrets: inherit

    npm:
        name: NPM audit
        uses: ./.github/workflows/npm-audit.yml
        secrets: inherit

    release:
        name: Release
        needs: [validate]
        runs-on: ubuntu-latest
        concurrency: ${{ github.workflow }}-release
        permissions:
            contents: write
            id-token: write
        steps:
        - uses: actions/checkout@v7
          with:
            fetch-depth: 0
            token: ${{ secrets.RELEASE_TOKEN }}
        - name: Select correct node version, install deps
          uses: ./.github/actions/setup
        - name: Configure git
          run: |
            git config user.name "domeq"
            git config user.email "iskra.wojtek@gmail.com"
        - name: Create a release
          env:
            GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          run: npm run release -- --ci
